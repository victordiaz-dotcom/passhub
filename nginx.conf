# Protección contra flood/DoS a nivel de este contenedor: limita solicitudes
# y conexiones concurrentes por IP. 20r/s con burst de 40 es muchísimo más de
# lo que un navegador real pide al cargar la SPA (unos pocos archivos
# estáticos), pero corta un flood sostenido. Van fuera del bloque server
# porque limit_req_zone/limit_conn_zone solo son válidas en el contexto http,
# y el contenido de este archivo se inserta ahí vía "include" (ver
# nginx.conf base de la imagen).
limit_req_zone $binary_remote_addr zone=req_zone:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Oculta la versión exacta de nginx en el header Server/en páginas de
    # error (info disclosure menor, sin ningún costo funcional).
    server_tokens off;

    # Servidor de archivos estáticos: nunca hay una razón legítima para un
    # body grande, y estos límites frenan tanto solicitudes abusivas
    # (flood) como conexiones "slow loris" que se quedan abiertas a medias.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    limit_req zone=req_zone burst=40 nodelay;
    limit_conn conn_zone 20;

    # include (no add_header aquí, a propósito): un location que define su
    # propio add_header (los dos de abajo, por Cache-Control) IGNORA por
    # completo los add_header del bloque server -- no los suma, los
    # reemplaza. Por eso los headers de seguridad se repiten vía "include"
    # dentro de cada location que también toca Cache-Control, en vez de
    # ponerlos aquí arriba nada más (se verificó con un build real: sin
    # esto, la página principal se servía sin ningún header de seguridad).
    include /etc/nginx/security-headers.conf;

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
